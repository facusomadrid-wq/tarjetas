<main class="tarjeta" id="tarjeta" data-url="https://facusomadrid-wq.github.io/tarjetas/ejemplo/" data-titulo="Nombre Ejemplo · FAC-USO Madrid">

  <p class="cargo">Delegado sindical</p>
  <p class="organizacion">FAC-USO Madrid</p>
  <ul class="contacto">
    <li><span class="etiqueta">Teléfono</span> <a href="tel:+34600000000">+34 600 000 000</a></li>
    <li><span class="etiqueta">Correo</span> <a href="mailto:ejemplo@example.org">ejemplo@example.org</a></li>
  </ul>
  <div class="acciones">
    <a class="boton boton-principal" href="contacto.vcf" download="ejemplo.vcf" type="text/vcard"><svg class="icono" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg><span>Guardar contacto</span></a>
