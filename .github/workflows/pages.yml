# Publica el sitio estático en GitHub Pages a través de la rama gh-pages
# (Settings → Pages → Deploy from a branch → gh-pages / (root)).
# Solo se publican: index.html, 404.html, robots.txt, .nojekyll, recursos/ y las carpetas de tarjeta
# (las que contienen sw.js y contacto.vcf). Nunca herramientas/, tests/, plantilla/, node_modules/ ni documentación.
name: Publicar tarjetas en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pruebas de la plantilla
        run: node --test 'tests/unidad/*.test.js'

      - name: Preparar la carpeta del sitio
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html robots.txt .nojekyll _site/
          cp -R recursos _site/recursos
          for carpeta in */; do
            carpeta="${carpeta%/}"
            case "$carpeta" in
              herramientas|tests|plantilla|node_modules|recursos|docs|_site) continue ;;
            esac
            if [ -f "$carpeta/sw.js" ] && [ -f "$carpeta/contacto.vcf" ] && [ -f "$carpeta/index.html" ]; then
              mkdir -p "_site/$carpeta"
              cp "$carpeta/index.html" "$carpeta/contacto.vcf" "$carpeta/manifest.webmanifest" \
                 "$carpeta/sw.js" "$carpeta/qr.svg" "_site/$carpeta/"
            fi
          done
          echo "Contenido publicado:"
          find _site -type f | sort

      - name: Publicar en la rama gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicación del sitio desde ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
